name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  # Cho phép bấm nút "Run workflow" thủ công trên giao diện GitHub
  workflow_dispatch:

# Cấp quyền cho GITHUB_TOKEN để deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép một deployment chạy tại một thời điểm
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt thư viện dependencies
        run: npm ci

      - name: Build ứng dụng web
        run: npm run build

      - name: Upload artifact lên GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Tiến hành triển khai
        id: deployment
        uses: actions/deploy-pages@v4
